<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Multi-LLM SEO Auditor PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        details > summary { list-style: none; cursor: pointer; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen flex flex-col">

    <header class="bg-slate-900 text-white shadow-md">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider">SEO Auditor <span class="text-blue-400">PRO</span></h1>
            <nav class="flex space-x-2">
                <button onclick="switchTab('tab-projects')" class="hover:bg-slate-700 px-3 py-2 rounded">Проекты</button>
                <button onclick="switchTab('tab-collect')" id="nav-collect" class="hover:bg-slate-700 px-3 py-2 rounded hidden">Сбор данных</button>
                <button onclick="switchTab('tab-analytics')" id="nav-analytics" class="hover:bg-slate-700 px-3 py-2 rounded">Аналитика</button>
                <button onclick="switchTab('tab-settings')" class="hover:bg-slate-700 px-3 py-2 rounded">Настройки</button>
            </nav>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-6 overflow-auto">
        <section id="tab-projects" class="tab-content active">
            <div class="flex justify-between mb-6">
                <h2 class="text-2xl font-bold">Мои проекты</h2>
                <button onclick="openProjectModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">+ Создать</button>
            </div>
            <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </section>

        <section id="tab-collect" class="tab-content">
            <div class="bg-white p-4 rounded shadow mb-4 border-l-4 border-blue-500 flex justify-between">
                <div>
                    <h2 class="text-xl font-bold" id="cp-name">Проект</h2>
                    <p class="text-sm text-gray-500" id="cp-info"></p>
                </div>
            </div>
            <div class="grid grid-cols-3 gap-6 mb-6">
                <div class="col-span-2 bg-white p-4 rounded shadow">
                    <label class="block mb-2 font-semibold">Поисковые запросы (с новой строки):</label>
                    <textarea id="input-queries" class="w-full border rounded p-2 h-32" placeholder="купить окна..."></textarea>
                </div>
                <div class="bg-white p-4 rounded shadow flex flex-col justify-between">
                    <div>
                        <p class="text-sm mb-2">Прогресс: <span id="status-progress" class="font-bold text-blue-600">0/0</span></p>
                        <p class="text-sm mb-2">Стоимость: <span id="status-cost" class="font-bold text-green-600">$0.0000</span></p>
                    </div>
                    <div class="space-y-2">
                        <button id="btn-start" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded">Запуск сессии</button>
                        <button id="btn-stop" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 rounded" disabled>Остановить</button>
                    </div>
                </div>
            </div>
            <h2 class="text-xl font-bold mb-4">Живой мониторинг</h2>
            <div id="results-container" class="space-y-4"></div>
        </section>

        <section id="tab-analytics" class="tab-content">
            <h2 class="text-2xl font-bold mb-6">Сводка по последней сессии</h2>
            <div class="grid grid-cols-2 gap-6 mb-6">
                <div class="bg-white p-6 rounded shadow text-center border-t-4 border-blue-500">
                    <h3 class="text-gray-500 text-sm font-bold uppercase mb-2">Общая видимость (V_общая)</h3>
                    <p id="stat-v-general" class="text-4xl font-bold text-slate-800">0%</p>
                </div>
                <div class="bg-white p-6 rounded shadow text-center border-t-4 border-green-500">
                    <h3 class="text-gray-500 text-sm font-bold uppercase mb-2">Взвешенная видимость (V_взвешенная)</h3>
                    <p id="stat-v-weighted" class="text-4xl font-bold text-slate-800">0%</p>
                </div>
            </div>
            <div class="bg-white p-4 rounded shadow">
                <h3 class="font-bold mb-4">Топ найденных конкурентов</h3>
                <ul id="competitors-list" class="space-y-2 text-sm"></ul>
            </div>
        </section>

        <section id="tab-settings" class="tab-content">
            <div class="bg-white p-6 rounded shadow max-w-2xl mx-auto">
                <h2 class="text-xl font-bold mb-4">Настройки системы</h2>
                <label class="block mb-1 text-sm">OpenRouter API Key:</label>
                <input type="password" id="set-or" class="w-full border rounded p-2 mb-4">
                <label class="block mb-1 text-sm">Wordstat API Key:</label>
                <input type="password" id="set-ws" class="w-full border rounded p-2 mb-4">
                <label class="block mb-1 text-sm">Системный промпт:</label>
                <textarea id="set-prompt" class="w-full border rounded p-2 mb-4 h-24"></textarea>
                <button id="btn-save-settings" class="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">Сохранить</button>
            </div>
        </section>
    </main>

    <div id="modal-project" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded shadow-lg w-[600px] max-h-[90vh] overflow-y-auto">
            <h2 class="text-xl font-bold mb-4">Настройки проекта</h2>
            <input type="hidden" id="p-id">
            <label class="block text-sm mb-1">Название:</label>
            <input type="text" id="p-name" class="w-full border p-2 mb-3 rounded">
            <label class="block text-sm mb-1">Целевые домены (через запятую):</label>
            <input type="text" id="p-domains" class="w-full border p-2 mb-3 rounded">
            <label class="block text-sm mb-1">Вариации бренда (через запятую):</label>
            <input type="text" id="p-brands" class="w-full border p-2 mb-3 rounded">
            <label class="block text-sm mb-1 font-bold">Модели OpenRouter:</label>
            <div id="p-models" class="h-40 overflow-y-auto border p-2 mb-4 bg-gray-50 text-sm">Загрузка моделей...</div>
            <div class="flex justify-end space-x-2">
                <button onclick="document.getElementById('modal-project').classList.add('hidden')" class="px-4 py-2 bg-gray-300 rounded">Отмена</button>
                <button id="btn-save-project" class="px-4 py-2 bg-blue-600 text-white rounded">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
    <script>
        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
