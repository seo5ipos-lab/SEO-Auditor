<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-LLM SEO Auditor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen flex flex-col">

    <header class="bg-slate-800 text-white shadow-md">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider">SEO Auditor <span class="text-sm text-blue-400">PRO</span></h1>
            <nav class="flex space-x-2" id="main-nav">
                <button onclick="switchTab('tab-projects')" class="hover:bg-slate-700 px-3 py-2 rounded font-medium">Проекты</button>
                <button onclick="switchTab('tab-collect')" id="nav-collect" class="hover:bg-slate-700 px-3 py-2 rounded font-medium hidden">Рабочий стол</button>
                <button onclick="switchTab('tab-settings')" class="hover:bg-slate-700 px-3 py-2 rounded font-medium">Настройки API</button>
            </nav>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-6 overflow-auto">

        <section id="tab-projects" class="tab-content active">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-slate-800">Мои проекты</h2>
                <button id="btn-create-project" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded shadow">+ Новый проект</button>
            </div>
            <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                </div>
        </section>

        <section id="tab-collect" class="tab-content">
            <div class="bg-white p-4 rounded shadow mb-6 flex justify-between items-center border-l-4 border-blue-500">
                <div>
                    <h2 class="text-xl font-bold" id="current-project-name">Название проекта</h2>
                    <p class="text-sm text-gray-500" id="current-project-info">Домены: ... | Бренд: ...</p>
                </div>
                <button id="btn-edit-project" class="text-sm text-blue-600 hover:underline">Редактировать</button>
            </div>

            <div class="grid grid-cols-2 gap-6 mb-6">
                <div class="bg-white p-4 rounded shadow">
                    <label class="block mb-2 text-sm font-semibold">Поисковые запросы (с новой строки):</label>
                    <textarea id="input-queries" class="w-full border border-gray-300 rounded p-2 mb-4 h-32" placeholder="купить окна..."></textarea>
                    <button id="btn-start" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded transition-colors">Запустить анализ</button>
                </div>
                
                <div class="bg-white p-4 rounded shadow">
                    <h3 class="text-sm font-semibold mb-2">Статус процесса</h3>
                    <div class="space-y-2 mb-4">
                        <p class="text-sm text-gray-600">Прогресс: <span id="status-progress" class="font-bold">0/0</span></p>
                    </div>
                    <button id="btn-stop" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition-colors" disabled>Экстренная остановка</button>
                </div>
            </div>

            <h2 class="text-xl font-bold mb-4">Результаты сканирования</h2>
            <div id="results-container" class="space-y-4"></div>
        </section>

        <section id="tab-settings" class="tab-content">
            <div class="bg-white p-6 rounded shadow max-w-2xl mx-auto">
                <h2 class="text-xl font-bold mb-4">Настройки системы</h2>
                <label class="block mb-2 text-sm">OpenRouter API Key:</label>
                <input type="password" id="setting-openrouter" class="w-full border rounded p-2 mb-4">
                <button id="btn-save-settings" class="bg-blue-600 text-white py-2 px-4 rounded">Сохранить</button>
            </div>
        </section>

    </main>

    <div id="project-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-white p-6 rounded shadow-lg w-[500px]">
            <h2 class="text-xl font-bold mb-4" id="modal-title">Настройки проекта</h2>
            <input type="hidden" id="proj-id">
            
            <label class="block mb-1 text-sm font-semibold">Название проекта:</label>
            <input type="text" id="proj-name" class="w-full border rounded p-2 mb-3" placeholder="Например: Окна Москвы">

            <label class="block mb-1 text-sm font-semibold">Целевые домены (через запятую):</label>
            <input type="text" id="proj-domains" class="w-full border rounded p-2 mb-3" placeholder="site.ru, my-site.com">

            <label class="block mb-1 text-sm font-semibold">Вариации бренда (через запятую):</label>
            <input type="text" id="proj-brands" class="w-full border rounded p-2 mb-3" placeholder="МояКомпания, MoyaCompany">

            <label class="block mb-1 text-sm font-semibold">Выбор моделей OpenRouter:</label>
            <div id="models-list" class="h-32 overflow-y-auto border p-2 rounded mb-4 bg-gray-50 text-sm">
                </div>

            <div class="flex justify-end space-x-2">
                <button onclick="closeModal()" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">Отмена</button>
                <button id="btn-save-project" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }
        function closeModal() {
            document.getElementById('project-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
